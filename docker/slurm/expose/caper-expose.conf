# Host paths visible to caper-server, at the same path inside the container.
# "ro|rw PATH". Top-level dir must be one of /gpfs0, /gpfs0-old, /mnt
# (anything else needs a new bind in docker-compose.yml + container recreate).
# Binds are non-recursive: submounts under a path (e.g. rclone fuse) are NOT exposed.
ro /gpfs0/work
rw /gpfs0/work/caper
ro /gpfs0-old/work/caper
ro /mnt/altnas/work/caper
ro /mnt/altnas/work/ultima/FASTQ
ro /mnt/altnas/work2/caper
